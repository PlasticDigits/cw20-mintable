# Required context: ci/woodpecker/pr/woodpecker. Real checks, no forged status.
when:
  - event: pull_request
  - event: [push, manual]
    branch: main
clone:
  - name: git
    image: woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      depth: 128
      lfs: false
      recursive: false
steps:
  - name: bounded-functional-checks
    image: rust:1.99-bookworm@sha256:e12566d5abc17a0da741628782cdb504b68b8961f5bfcf677936bf3e8b32de29
    commands:
      - timeout --signal=TERM --kill-after=20s 10m bash scripts/ci/check.sh

[package]
name = "cw20-security-controller"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0"
description = "Bounded shared security authority for CW20 token guards"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "security-controller-schema"
path = "src/bin/schema.rs"

[features]
library = []

[dependencies]
cw20-security-interface = { path = "../../packages/security-interface" }
cosmwasm-schema = "1.5.9"
cosmwasm-std = "1.5.11"
cw-storage-plus = "1.2.0"
cw2 = "1.1.2"
thiserror = "1.0.4"
